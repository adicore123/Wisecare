<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Deep Slate to Ocean Teal -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081420" />
      <stop offset="50%" stop-color="#0a222c" />
      <stop offset="100%" stop-color="#063236" />
    </linearGradient>

    <!-- Subtle Ambient Center Glow -->
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#14b8a6" stop-opacity="0.25" />
      <stop offset="60%" stop-color="#0d9488" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#081420" stop-opacity="0" />
    </radialGradient>

    <!-- Care Ribbon / Encompassing Flow Gradient (Teal to Cyan to Mint) -->
    <linearGradient id="flowGrad" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="35%" stop-color="#22d3ee" />
      <stop offset="70%" stop-color="#14b8a6" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>

    <!-- Central Sprout / Heart - Radiant Emerald to Mint -->
    <linearGradient id="heartLeafGrad" x1="20%" y1="100%" x2="80%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="45%" stop-color="#10b981" />
      <stop offset="85%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#6ee7b7" />
    </linearGradient>

    <!-- Soft Drop Shadow -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#010d12" flood-opacity="0.55" />
    </filter>
  </defs>

  <!-- Full-Bleed Background for PWA Maskable Support -->
  <rect width="512" height="512" fill="url(#bgGrad)" />
  <circle cx="256" cy="256" r="235" fill="url(#centerGlow)" />

  <!-- Core Icon: Smooth, Harmonious Care Loop & Heart-Leaf -->
  <g filter="url(#softShadow)">
    <!-- Seamless Surrounding Loop of Care (No dot, smooth continuous organic embrace) -->
    <path
      d="M256 120 
         C336 120, 396 174, 396 252 
         C396 326, 342 384, 272 384 
         C232 384, 206 364, 186 342
         C178 333, 184 320, 196 320
         C202 320, 208 324, 214 330
         C230 348, 248 358, 272 358
         C326 358, 368 312, 368 252
         C368 188, 320 146, 256 146
         C192 146, 144 192, 144 260
         C144 322, 188 376, 252 398
         C264 402, 268 416, 260 424
         C254 430, 244 430, 236 426
         C160 398, 116 334, 116 260
         C116 176, 176 120, 256 120 Z"
      fill="url(#flowGrad)"
    />

    <!-- Central Heart-Leaf (Healing, Vitality & Emotional Holding) -->
    <path
      d="M256 360 
         C256 360, 192 292, 192 240 
         C192 202, 222 178, 256 210 
         C290 178, 320 202, 320 240 
         C320 292, 256 360, 256 360 Z"
      fill="url(#heartLeafGrad)"
    />

    <!-- Gentle Inner Leaf Spine (Organizational Clarity & Focus) -->
    <path
      d="M256 220 L256 338"
      stroke="#ffffff"
      stroke-width="5"
      stroke-linecap="round"
      opacity="0.85"
    />
  </g>
</svg>
